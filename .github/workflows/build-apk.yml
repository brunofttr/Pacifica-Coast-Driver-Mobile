name: APK derle
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }

      - name: Android SDK (build-tools 36, platform 36)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-36" > /dev/null

      - name: Oyunu derle
        run: php build.php

      - name: APK oluştur
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/36.0.0"; JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          A=apk; O=$A/out; D=dist
          rm -rf $O $A/assets $A/assets-lite; mkdir -p $O/classes $A/assets $A/assets-lite
          sed 's/window.PC_DIST = 1;/window.PC_DIST = 1; window.PC_PACK_DIR = ""; window.PC_VIDEO_DIR = "";/' $D/pacifica-coast.html > $A/assets/pacifica-coast.html
          cp $D/data/*.js $A/assets/ ; cp $D/video/*.mp4 $A/assets/ 2>/dev/null || true
          cp $D/video/*.mp4 $A/assets-lite/ 2>/dev/null || true
          L=""; for id in c037 c011 veloster; do [ -f $D/data/$id.js ] && cp $D/data/$id.js $A/assets-lite/ && L="$L,\"$id\""; done
          sed -E "s/window\.PC_CARS = \[[^]]*\];/window.PC_CARS = [${L#,}];/" $A/assets/pacifica-coast.html > $A/assets-lite/pacifica-coast.html
          javac --release 11 -nowarn -cp "$JAR" -d $O/classes $A/src/com/pacifica/coast/MainActivity.java
          "$BT/d8" --lib "$JAR" --min-api 28 --output $O $O/classes/com/pacifica/coast/*.class
          "$BT/aapt2" compile --dir $A/res -o $O/res.zip
          keytool -genkeypair -keystore $O/ci.jks -storepass android -keypass android -alias ci \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CI" > /dev/null
          for v in "assets pacifica-coast-driver-mobile.apk" "assets-lite pacifica-coast-driver-mobile-lite.apk"; do
            set -- $v
            "$BT/aapt2" link -o $O/b.apk --manifest $A/AndroidManifest.xml -I "$JAR" -A $A/$1 -R $O/res.zip --min-sdk-version 28 --target-sdk-version 36
            (cd $O && zip -q b.apk classes.dex)
            "$BT/zipalign" -f -p 4 $O/b.apk $O/al.apk
            "$BT/apksigner" sign --ks $O/ci.jks --ks-pass pass:android --out $O/$2 $O/al.apk
            rm $O/b.apk $O/al.apk
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk/out/*.apk
